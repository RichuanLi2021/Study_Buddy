image: node:latest

stages:
  - build
  - test
  - deploy

cache:
  paths:
    - node_modules/

# Build for Android
android_build:
  stage: build
  script:
    - cd frontend
    - npm install
    - npx expo build:android --no-wait  # Build Android APK in Expo's classic mode

# Build for iOS
ios_build:
  stage: build
  script:
    - cd frontend
    - npm install
    - npx expo build:ios --no-wait  # Build iOS IPA in Expo's classic mode

# Build for Web
web_build:
  stage: build
  script:
    - cd frontend
    - npm install
    - npx expo build:web  # Build static assets for web
  only:
    - master

# test:
